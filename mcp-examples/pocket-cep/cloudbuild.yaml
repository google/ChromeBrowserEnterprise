# Cloud Build configuration to build and push Pocket CEP containers.
# Pushes both the Next.js frontend and the MCP server sidecar in a single run.

steps:
  # 1. Build Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', '${_REGISTRY_URL}/frontend:latest',
      '-f', 'Dockerfile.frontend',
      '.'
    ]

  # 2. Build MCP Server Image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', '${_REGISTRY_URL}/mcp-server:latest',
      '-f', 'Dockerfile.mcp',
      '.'
    ]

images:
  - '${_REGISTRY_URL}/frontend:latest'
  - '${_REGISTRY_URL}/mcp-server:latest'

# Write logs to Cloud Logging only to allow streaming logs through corporate VPC perimeters
options:
  logging: CLOUD_LOGGING_ONLY
